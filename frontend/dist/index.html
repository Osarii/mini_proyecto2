<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal de Políticas de RRHH · RAG Multiagente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Smooth scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Tabular numbers for live stopwatch and metrics */
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Compositor-only subtle animations, respecting reduced-motion */
      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes modalScaleIn {
        from {
          opacity: 0;
          transform: scale(0.96) translateY(6px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes toastSlideIn {
        from {
          opacity: 0;
          transform: translateX(16px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .animate-tab-enter {
        @media (prefers-reduced-motion: no-preference) {
          animation: fadeSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
      }

      .animate-msg-enter {
        @media (prefers-reduced-motion: no-preference) {
          animation: fadeSlideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
      }

      .animate-modal-enter {
        @media (prefers-reduced-motion: no-preference) {
          animation: modalScaleIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
      }

      .animate-toast-enter {
        @media (prefers-reduced-motion: no-preference) {
          animation: toastSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
      }

      .card-interactive {
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;
      }
      @media (prefers-reduced-motion: no-preference) {
        .card-interactive:hover {
          transform: translateY(-2px);
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-WMAbUlja.js"></script>
  </head>
  <body class="bg-gradient-to-br from-slate-50 via-white to-blue-50/40 text-slate-800 antialiased min-h-screen selection:bg-brand-100 selection:text-brand-900">
    <div id="root"></div>
  </body>
</html>
